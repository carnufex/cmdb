name: cmdb

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: cmdb
      POSTGRES_USER: cmdb
      POSTGRES_PASSWORD: ${CMDB_DB_PASSWORD:?sätt CMDB_DB_PASSWORD i .env}
    ports:
      - "${CMDB_DB_PORT:-15432}:5432"
    volumes:
      - cmdb-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmdb -d cmdb"]
      interval: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Cmdb: Host=db;Database=cmdb;Username=cmdb;Password=${CMDB_DB_PASSWORD}
      Database__MigrateOnStartup: "true"
      # The homelab's Authentik (Rosenvalls-Homelab, blueprint apps-cmdb.yaml).
      Auth__Authority: ${OIDC_AUTHORITY:-https://authentik.rosenvall.se/application/o/cmdb/}
    ports:
      - "${CMDB_API_PORT:-8481}:8080"
    healthcheck:
      test: ["CMD", "dotnet", "Cmdb.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./src/web
    restart: unless-stopped
    environment:
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:-https://authentik.rosenvall.se/application/o/cmdb/}
      OIDC_CLIENT_ID: cmdb-web
      # esri (default) or none. None makes no requests to external map services (ADR-0010).
      MAP_BASEMAP: ${MAP_BASEMAP:-esri}
    ports:
      - "${CMDB_WEB_PORT:-8480}:8080"
    depends_on:
      api: { condition: service_healthy }

volumes:
  cmdb-db:
