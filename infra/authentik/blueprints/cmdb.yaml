# cmdb: OIDC client for the web app and three synthetic demo users.
# Applied automatically by the authentik worker (mounted at /blueprints/custom).
# The demo password comes from CMDB_DEMO_PASSWORD so no secret is checked in.
version: 1
metadata:
  name: cmdb
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Groups are later mapped to access scopes (see docs/arkitektur.md#behörighet).
  - model: authentik_core.group
    id: group-full
    identifiers:
      name: cmdb-full
    attrs:
      attributes:
        description: Full åtkomst till hela nätet
  - model: authentik_core.group
    id: group-region
    identifiers:
      name: cmdb-region-nord
    attrs:
      attributes:
        description: Åtkomst begränsad till region Nord (polygon)
  - model: authentik_core.group
    id: group-project
    identifiers:
      name: cmdb-projekt-a
    attrs:
      attributes:
        description: Åtkomst begränsad till projekt A

  - model: authentik_core.user
    identifiers:
      username: demo-full
    attrs:
      name: Demo Full
      email: demo-full@cmdb.local
      type: internal
      is_active: true
      password: !Env [CMDB_DEMO_PASSWORD, null]
      groups:
        - !KeyOf group-full
  - model: authentik_core.user
    identifiers:
      username: demo-region
    attrs:
      name: Demo Region
      email: demo-region@cmdb.local
      type: internal
      is_active: true
      password: !Env [CMDB_DEMO_PASSWORD, null]
      groups:
        - !KeyOf group-region
  - model: authentik_core.user
    identifiers:
      username: demo-projekt
    attrs:
      name: Demo Projekt
      email: demo-projekt@cmdb.local
      type: internal
      is_active: true
      password: !Env [CMDB_DEMO_PASSWORD, null]
      groups:
        - !KeyOf group-project

  # Public client: the browser does authorization code + PKCE, no client secret.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: cmdb
    attrs:
      client_type: public
      client_id: cmdb-web
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_token_validity: hours=1
      refresh_token_validity: hours=8
      redirect_uris:
        - matching_mode: strict
          url: !Format ["http://localhost:%s/auth/callback", !Env [CMDB_WEB_PORT, "8480"]]
        - matching_mode: strict
          url: http://localhost:4200/auth/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

  - model: authentik_core.application
    identifiers:
      slug: cmdb
    attrs:
      name: CMDB
      provider: !KeyOf provider
      meta_description: POC med syntetisk data
      policy_engine_mode: any
