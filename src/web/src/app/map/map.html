<div #target class="map" aria-label="Karta över nätet"></div>

@if (hover(); as h) {
  <div class="hover" [style.left.px]="h.x + 14" [style.top.px]="h.y + 14">
    <span class="mono">{{ h.code }}</span>
    @if (h.name) {
      <span class="name">{{ h.name }}</span>
    }
  </div>
}

<aside class="legend" aria-label="Teckenförklaring">
  <cmdb-status value="in_service" />
  <cmdb-status value="under_construction" />
  <cmdb-status value="planned" />
  @if (operationsShown()) {
    <ul class="ops" aria-label="Driftläge">
      <li><span class="sym fault" aria-hidden="true"></span>Fel och ärenden</li>
      <li><span class="sym down" aria-hidden="true"></span>Tappar sin väg</li>
      <li><span class="sym false" aria-hidden="true"></span>Falsk redundans</li>
      <li><span class="sym work" aria-hidden="true"></span>Arbete (streckat: planerat)</li>
      <li><span class="sym risk" aria-hidden="true"></span>Risk</li>
    </ul>
  }
  @if (zoom() < detailZoom) {
    <p class="hint">Zooma in för att se accessiter och små kablar.</p>
  }
</aside>
