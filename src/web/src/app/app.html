<header class="topbar">
  <a class="brand" href="/">CMDB</a>
  <span class="synthetic" title="All data är påhittad">Syntetisk data</span>

  <div class="command" role="search"></div>

  <div class="actions">
    <button
      type="button"
      class="icon-button"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.theme() === 'dark' ? 'Byt till ljust tema' : 'Byt till mörkt tema'"
      [title]="theme.theme() === 'dark' ? 'Ljust tema' : 'Mörkt tema'"
    >
      @if (theme.theme() === 'dark') {
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="3.2" />
          <path
            d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"
          />
        </svg>
      } @else {
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5Z" />
        </svg>
      }
    </button>

    @if (me.value(); as me) {
      <span class="user" [title]="me.groups.join(', ')">{{ me.name ?? me.username }}</span>
    } @else if (me.error()) {
      <span class="user error">API:t svarar inte</span>
    }
    @if (auth.isAuthenticated()) {
      <button type="button" class="text-button" (click)="auth.logout()">Logga ut</button>
    }
  </div>
</header>

<main class="workspace">
  <section class="lens">
    <router-outlet />
  </section>
</main>
